name: Publish verified WordPress.org release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable GitHub tag, such as v1.2.4
        required: true
        type: string
  workflow_run:
    workflows: [Publish tested tagged plugin release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: wordpress-org-social-metadata
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      vars.WPORG_PLUGIN_APPROVED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    environment: wordpress-org
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Stage exact public release bytes and record source identity
        id: stage
        run: python tools/stage-wordpress-release.py --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: kieran-epk-social-metadata
          VERSION: ${{ steps.stage.outputs.version }}
          BUILD_DIR: wordpress-build/kieran-epk-social-metadata
      - name: Retain exact published source and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-publication-${{ github.run_id }}
          path: wordpress-publication.json
          if-no-files-found: ignore
